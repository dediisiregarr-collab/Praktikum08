<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luas dan Keliling Lingkaran</title>
</head>
<body>
    <h2>Luas Lingkaran</h2>
    <label for="jari">Jari-Jari (r) :</label>
    <input type="number" id="jari">
    <br>
    <span id="luas"></span>
    
    <hr>
    <br>

    <h2>Keliling Lingkaran</h2>
    <label for="jari2">Jari-Jari (r) :</label>
    <input type="number" id="jari2">
    <br>
    <span id="keliling"></span>

    <script>
        function hitung_luas() {
            let r = parseFloat(document.getElementById("jari").value);
            let luas = Math.PI * r * r;
            document.getElementById("luas").innerHTML = "Luas = " + luas.toFixed(2);
        }

        function hitung_keliling() {
            let r = parseFloat(document.getElementById("jari2").value);
            let keliling = 2 * Math.PI * r;
            document.getElementById("keliling").innerHTML = "Keliling = " + keliling.toFixed(2);
        }

        document.getElementById("jari").addEventListener("input", hitung_luas);
        document.getElementById("jari2").addEventListener("input", hitung_keliling);
    </script>

</body>
</html>
